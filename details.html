<!DOCTYPE html>
<html lang="pt-BR">
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="details_page_title">Detalhes das notícias</title>

    <!-- FavIcon -->
    <link rel="icon" href="assets/favicon.png" type="image/png">

    <!-- Choices.js Styles -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    
    <!-- Flatpickr (calendar) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/pt.js"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>

    <!-- Lucide icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="details.css">
    <!-- defer attribute indicates to the browser that the script 
    should only be executed after the HTML has been fully parsed -->
    <script type="module" src="./js/details.js" defer></script>
</head>

<body>
    <!-- FGV header -->
    <header class="brand-header" id="top">
        <div class="header-content">
            <!-- DINT logo and title -->
            <div class="logo-wrapper">
                <img src="assets/logodint_pt.svg" alt="Logo FGV" class="logo-dint" data-i18n-img="app_logo">
            </div>
            
            <!-- App title and subtitle -->
            <div class="brand-title">
                <h1 data-i18n="app_title">FGV IMídIA</h1>
                <span class="subtitle" data-i18n="app_subtitle">Indicador de Imagem na Mídia Digital</span>
            </div>

            <!-- Language and close button -->
            <div class="header-actions">
                <div class="lang-dropdown-wrapper">
                    <i data-lucide="languages" class="lang-icon"></i>
                    <select id="language-select" class="lang-select"></select>
                </div>
                
                <button onclick="window.close()" class="btn-close">
                    <i data-lucide="x" class="icon-16"></i> <span data-i18n="btn_close">Fechar</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Sub-header -->
    <div class="details-subheader">
        <div class="details-context">
            <h2 id="page-title">
                <span data-i18n="details_title_prefix">Notícias que compõem o FGV IMídIA em</span> 
                <span id="date-span">--</span>
            </h2>
            <p id="filter-summary"><span data-i18n="loading_filters"></span></p>
        </div>

        <div class="controls">
            <!-- Categories -->
            <div class="dropdown">
                <button class="btn-outline filter-btn">
                    <div class="btn-inner">
                        <i data-lucide="layers" class="icon-16"></i>
                        <span data-i18n="label_category">Categorias exibidas</span>
                    </div>
                </button>
                <div class="dropdown-content filter-dropdown" id="category-selector">
                    <!-- checkboxes generated by details.js -->
                </div>
            </div>

            <!-- Evaluator -->
            <div class="dropdown">
                <button class="btn-outline filter-btn">
                    <div class="btn-inner">
                        <i data-lucide="user-check" class="icon-16"></i>
                        <span data-i18n="details_reviewer">Ente avaliador</span>
                    </div>
                </button>
                <div class="dropdown-content filter-dropdown" id="evaluator-selector">
                    <!-- generated by details.js -->
                </div>
            </div>
            
            <!-- Evaluated -->
            <div class="dropdown">
                <button class="btn-outline filter-btn">
                    <div class="btn-inner">
                        <i data-lucide="target" class="icon-16"></i>
                        <span data-i18n="details_reviewed">Ente em avaliação</span>
                    </div>
                </button>
                <div class="dropdown-content filter-dropdown" id="evaluated-selector">
                    <!-- generated by details.js -->
                </div>
            </div>

            <!-- Date:hour of start/end -->
            <div class="date-control-group">
                <input type="text" id="start-date" class="btn-outline date-input" placeholder="Data inicial...">
                <input type="text" id="end-date" class="btn-outline date-input" placeholder="Data final...">
            </div>
            
            <!-- Apply button -->
            <div class="filter-apply">
                <button class="btn-apply btn-outline" id="btn-apply">
                    <div class="btn-inner">
                        <i data-lucide="check-circle" class="icon-16"></i>
                        <span data-i18n="btn_apply">Aplicar mudanças</span>
                    </div>
                </button>
            </div>

            <!-- Divider -->
            <div class="filter-divider"></div>

            <!-- Visible columns -->
            <div class="dropdown">
                <button class="btn-outline filter-btn">
                    <i data-lucide="columns-3" class="icon-16"></i> 
                    <span data-i18n="btn_choose_columns">Escolha as colunas visíveis</span>
                </button>
                <div class="dropdown-content filter-dropdown" id="column-selector">
                    <!-- checkboxes generated by details.js -->
                </div>
            </div>

            <!-- Pagination and limit controls -->
            <div class="pagination-container">
                <div class="limit-control">
                    <span data-i18n="label_show">Exibir:</span>
                    <div class="dropdown">
                        <button class="btn-outline pag-btn dropdown-limit">
                            <span id="limit-label">...</span>
                        </button>
                        <div class="dropdown-content dropdown-limit" id="limit-selector">
                            <!-- Options generated by JS (50, 100, 500, 1000) -->
                        </div>
                    </div>
                </div>
                
                <div class="range-control">
                    <button id="prev-page" class="btn-icon" disabled>
                        <i data-lucide="chevron-left"></i>
                    </button>
                    
                    <div class="dropdown">
                        <button class="btn-outline pag-btn dropdown-range">
                            <span id="page-range-label"></span>
                        </button>
                        <div class="dropdown-content dropdown-range-content" id="page-range-selector">
                            <!-- Options generated by JS -->
                        </div>
                    </div>

                    <button id="next-page" class="btn-icon" disabled>
                        <i data-lucide="chevron-right"></i>
                    </button>
                    
                    <span class="total-count-label">
                        de <strong id="total-news-count">...</strong> 
                        <span data-i18n="label_news_count">notícias</span>
                    </span>
                </div>
            </div>
        </div>
    </div>

    <!-- table -->
    <div class="table-container">
        <table id="news-table">
            <thead>
                <tr id="table-header">
                    <!-- JS-generated headers -->
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="100%" class="state-message"></td></tr>
            </tbody>
        </table>
    </div>
    
</body>
</html>
