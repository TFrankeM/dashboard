<!DOCTYPE html>
<html lang="pt-BR">
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="details_page_title">Detalhes das notícias</title>
    <link rel="icon" href="assets/favicon.png" type="image/png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="details.css">
    <!-- defer attribute indicates to the browser that the script should only be executed after the HTML has been fully parsed -->
    <script type="module" src="./js/details.js" defer></script>
</head>

<body>
    <!-- FGV header -->
    <header class="brand-header" id="top">
        <div class="header-content">
            <div class="logo-wrapper">
                <img src="assets/logodint_pt.svg" alt="Logo FGV" class="logo-dint" data-i18n-img="app_logo">
            </div>
            
            <div class="brand-title">
                <div>
                    <h1 data-i18n="app_title">FGV IMídIA</h1>
                    <span class="subtitle" data-i18n="app_subtitle">Indicador de Imagem na Mídia Digital</span>
                </div>
            </div>

            <div class="header-actions">
                <div class="lang-dropdown-wrapper">
                    <i data-lucide="languages" class="lang-icon"></i>
                    <select id="language-select" class="lang-select"></select>
                </div>
                
                <button onclick="window.close()" class="btn btn-close">
                    <i data-lucide="x"></i> <span data-i18n="btn_close">Fechar</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Sub-header -->
    <div class="details-subheader">
        <div class="details-context">
            <h2 id="page-title"><span data-i18n="details_title_prefix">Notícias que compõem o FGV IMídIA em</span> <span id="date-span">--</span></h2>
            <p id="filter-summary"><span data-i18n="loading_filters"></span></p>
        </div>

        <div class="controls">
            <!-- Menu to select visible columns -->
            <div class="dropdown">
                <div class="dropdown">
                    <button class="btn btn-outline">
                        <i data-lucide="columns"></i> <span data-i18n="btn_choose_columns">Escolha as colunas visíveis</span>
                    </button>
                    <div class="dropdown-content" id="column-selector">
                        <!-- checkboxes generated by details.js -->
                    </div>
                </div>
            </div>
            <!-- Pagination and limit controls -->
            <div class="pagination-container">
                <div class="limit-control">
                    <span data-i18n="label-show">Exibir:</span>
                    <select id="limit-select"></select>
                    <span data-i18n="label_news_count">notícias</span>
                </div>
                <div class="range-control">
                    <button id="prev-page" class="btn-icon" disabled aria-label="Página anterior">
                        <i data-lucide="chevron-left"></i>
                    </button>

                    <select id="page-range-select" aria-label="Selecionar intervalo"></select>

                    <span class="total-count-label">
                        <span data-i18n="label_of">de</span> <span id="total-news-count" class="data-number">--</span>
                    </span>

                    <button id="next-page" class="btn-icon" disabled aria-label="Próxima página">
                        <i data-lucide="chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- table -->
    <div class="table-container">
        <table id="news-table">
            <thead>
                <tr id="table-header">
                    <!-- JS-generated headers -->
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="10" class="state-message">--</td></tr>
            </tbody>
        </table>
    </div>
    
</body>
</html>
