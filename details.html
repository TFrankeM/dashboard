<!DOCTYPE html>
<html lang="pt-BR">
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="details_page_title">Detalhes das notícias</title>
    <meta name="description" content="Tabela detalhada das notícias que compõem o FGV IIBEx, com filtros por período, entidade e categoria.">
    <meta property="og:title" content="FGV IIBEx | Detalhes das notícias">
    <meta property="og:description" content="Notícias que compõem o indicador da imagem do Brasil no exterior.">

    <!-- FavIcon -->
    <link rel="icon" href="assets/favicon.png" type="image/png">

    <!-- Apply the theme before first paint (avoids a flash); dark is the
         default, light only when the user explicitly chose it. -->
    <script>
        try {
            if (localStorage.getItem("iibex_theme") !== "light") {
                document.documentElement.dataset.theme = "dark";
            }
        } catch (e) {
            document.documentElement.dataset.theme = "dark";
        }
    </script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/details.css">
    <link rel="stylesheet" href="css/buttons.css">

    <!-- Dependencies (versions pinned to avoid silent breaking upgrades) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js@11.2.3/public/assets/styles/choices.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/choices.js@11.2.3/public/assets/scripts/choices.min.js" defer></script>
    <script src="https://unpkg.com/lucide@1.23.0" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/pt.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/es.js" defer></script>
</head>
<body>

    <!-- Header -->
    <header class="brand-header">
        <div class="header-content">
            <div class="logo-wrapper">
                <a href="index.html" class="home-link" data-i18n-title="home_link" title="Voltar à tela inicial">
                    <img src="assets/logodint_pt.svg" alt="FGV DINT" class="logo-dint" data-i18n-img="app_logo">
                </a>
            </div>

            <div class="brand-title">
                <h1 data-i18n="app_title">FGV IIBEx</h1>
                <span class="subtitle" data-i18n="app_subtitle">Indicador da Imagem do Brasil no Exterior</span>
            </div>

            <div class="header-actions">
                <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false" aria-label="Ativar modo escuro">
                    <i data-lucide="sun" class="icon-sun"></i>
                    <i data-lucide="moon" class="icon-moon"></i>
                </button>
                <div class="lang-dropdown-wrapper">
                    <i data-lucide="languages" class="lang-icon"></i>
                    <select id="language-select" class="lang-select"></select>
                </div>

                <button id="btn-close" class="btn-close">
                    <i data-lucide="x" class="icon-16"></i> <span data-i18n="btn_close">Fechar</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Sub-header -->
    <div class="details-subheader">
        <div class="details-context">
            <h2 id="page-title">
                <span data-i18n="details_title_prefix">Notícias que compõem o FGV IIBEx em</span> 
                <span id="date-span">--</span>
            </h2>
            <p id="filter-summary"><span data-i18n="loading_filters"></span></p>
        </div>

        <button class="mobile-filter-btn" id="mobile-filter-toggle">
            <i data-lucide="filter" class="icon-16"></i>
            <span id="mobile-filter-text" data-i18n="btn_show_filters">Mostrar filtros</span>
            <i data-lucide="chevron-down" class="icon-16 chevron"></i>
        </button>

        <div class="filters-collapse" id="filters-wrapper">
            <div class="controls">
                <!-- Evaluator -->
                <div class="dropdown">
                    <button class="btn-outline filter-btn">
                        <div class="btn-inner">
                            <i data-lucide="eye" class="cbx-icon"></i>
                            <span data-i18n="details_evaluatorEntity">Ente avaliador</span>
                        </div>
                    </button>
                    <div class="dropdown-content filter-dropdown" id="evaluator-selector">
                        <!-- generated by details.js -->
                    </div>
                </div>
                
                <!-- Evaluated -->
                <div class="dropdown">
                    <button class="btn-outline filter-btn">
                        <div class="btn-inner">
                            <i data-lucide="target" class="icon-16"></i>
                            <span data-i18n="details_evaluatedEntity">Ente em avaliação</span>
                        </div>
                    </button>
                    <div class="dropdown-content filter-dropdown" id="evaluated-selector">
                        <!-- generated by details.js -->
                    </div>
                </div>

                <!-- Categories -->
                <div class="dropdown">
                    <button class="btn-outline filter-btn">
                        <div class="btn-inner">
                            <i data-lucide="tags" class="cbx-icon"></i>
                            <span data-i18n="label_category">Categorias exibidas</span>
                        </div>
                    </button>
                    <div class="dropdown-content filter-dropdown" id="category-selector">
                        <!-- checkboxes generated by details.js -->
                    </div>
                </div>

                <!-- Date:hour of start/end -->
                <div class="date-control-group">
                    <div>
                        <input type="text" id="start-date" class="btn-outline date-input" placeholder="Data inicial...">
                    </div>
                    <div>
                        <input type="text" id="end-date" class="btn-outline date-input" placeholder="Data final...">
                    </div>
                </div>
                <!-- Apply button -->
                <div class="filter-apply">
                    <button class="btn-apply" id="btn-apply">
                        <div class="btn-inner">
                            <i data-lucide="check-circle" class="icon-16"></i>
                            <span data-i18n="btn_apply">Aplicar mudanças</span>
                        </div>
                    </button>
                </div>
            </div>

            <!-- Divider -->
            <div class="filter-divider"></div>

            <div class="controls">
                <!-- Visible columns -->
                <div class="dropdown">
                    <button class="btn-outline filter-btn">
                        <div class="btn-inner">
                            <i data-lucide="columns-3" class="icon-16"></i> 
                            <span data-i18n="btn_choose_columns">Escolha as colunas visíveis</span>
                        </div>
                    </button>
                    <div class="dropdown-content filter-dropdown" id="column-selector">
                        <!-- checkboxes generated by details.js -->
                    </div>
                </div>

                <!-- Pagination and Results Limit -->
                <div class="pagination-container">
                    <div class="limit-control">
                        <span data-i18n="label_show">Exibir:</span>
                        <div class="dropdown">
                            <button class="btn-outline pag-btn dropdown-limit">
                                <span id="limit-label">...</span>
                            </button>
                            <div class="dropdown-content dropdown-limit" id="limit-selector">
                                <!-- JS populate (50, 100, 500) -->
                            </div>
                        </div>
                        <span data-i18n="label_news_count">notícias</span>
                    </div>

                    <div class="range-control">
                        <button id="prev-page" class="btn-icon" disabled>
                            <i data-lucide="chevron-left"></i>
                        </button>
                        
                        <div class="dropdown">
                            <button class="btn-outline pag-btn dropdown-range">
                                <span id="page-range-label"></span>
                            </button>
                            <div class="dropdown-content dropdown-range-content" id="page-range-selector">
                                <!-- Options generated by JS -->
                            </div>
                        </div>

                        <button id="next-page" class="btn-icon" disabled>
                            <i data-lucide="chevron-right"></i>
                        </button>
                        
                        <span class="total-count-label">
                            <span data-i18n="label_of">de</span> <strong id="total-news-count">...</strong> 
                            <span data-i18n="label_news_count">notícias</span>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="table-container">
        <table id="news-table">
            <thead>
                <tr id="table-header">
                    <!-- JS-generated headers -->
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="100%" class="state-message"></td></tr>
            </tbody>
        </table>
    </div>
    
    <!-- Scripts -->
    <script type="module" src="js/details.js"></script>

</body>
</html>
